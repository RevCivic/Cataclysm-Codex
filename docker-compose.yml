services:
  postgres:
    image: postgres:16-alpine
    container_name: cataclysm-codex-db
    environment:
      - POSTGRES_USER=codex
      - POSTGRES_PASSWORD=codex
      - POSTGRES_DB=cataclysm_codex
    volumes:
      - codex-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  codex:
    image: ${CODEX_IMAGE:-cataclysm-codex:latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: cataclysm-codex
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Store imported images (portraits, references)
      - codex-images:/app/images
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=codex
      - DB_PASSWORD=codex
      - DB_NAME=cataclysm_codex
      - IMAGES_PATH=/app/images
      # Required to enable source imports in production. Set this in .env or your secret store.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - SOURCE_SNAPSHOT_PATH=/app/data/source-snapshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  codex-postgres:
    driver: local
  codex-images:
    driver: local
